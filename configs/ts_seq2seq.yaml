defaults:
  - data: sequence_regr
  - model: t2v_xfmr_regr
  - _self_
hydra:
  sweeper:
    params:
      model.d_model: 256
      model.nhead: 8
      model.n_layers: 6
      model.dim_feedforward: 256
      model.dropout: 0.1, 0.2, 0.3
      # model: xfmr_regr, t2v_xfmr_regr, t2vp_xfmr_regr
# Training parameters
training:
  batch_size: 1024
  num_epochs: 100
  num_workers: 0
  val_split: 0.5
  shuffle: True
