defaults:
  - data: sequence_regr
  - model: t2v_lstm_regressor
  - _self_
hydra:
  sweeper:
    params:
      # model.kernel_size: 2
      model.pool: cls
      model.d_model: 128
      model.nhead: 4
      model.n_layers: 4
      model.dim_feedforward: 256
      # model.dropout: 0.1, 0.2, 0.3
      model: xfmr_regr, t2v_xfmr_regr, t2vp_xfmr_regr
# Training parameters
training:
  batch_size: 1024
  num_epochs: 100
  num_workers: 0
  val_split: 0.5
  shuffle: True
